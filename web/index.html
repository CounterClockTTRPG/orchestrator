<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guild</title>
  <meta name="description" content="Guild orchestrates Claude Code agents. Agents and scripts: read /llms.txt or GET /api for the JSON API.">
  <link rel="help" href="/llms.txt">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&family=Orbitron:wght@500;700&family=Exo+2:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="/web/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 L20 12 L30 12 L22 19 L25 30 L16 23 L7 30 L10 19 L2 12 L12 12 Z' fill='%23d4af37'/%3E%3C/svg%3E">
</head>
<body>
  <noscript><p>Guild orchestrates Claude Code agents. This page needs JavaScript. Agents and scripts: read <a href="/llms.txt">/llms.txt</a>, or GET <a href="/api">/api</a> for the JSON API.</p></noscript>
  <header class="bar">
    <a class="brand" href="#/"><span class="sigil">✦</span> <span data-w="brand">Guild</span></a>
    <nav id="quest-tabs" class="tabs"></nav>
    <div class="bar-actions">
      <span id="queue-info" class="muted small"></span>
      <button id="new-quest-btn" class="btn gold" data-w="post">Post a quest</button>
      <button id="settings-btn" class="btn ghost" title="Settings and roles">⚙</button>
    </div>
  </header>

  <main id="view"></main>

  <!-- New quest -->
  <dialog id="new-quest" class="panel">
    <form method="dialog" id="new-quest-form">
      <h2 data-w="post">Post a quest</h2>
      <label>Goal
        <textarea name="goal" rows="5" required data-w-placeholder="goalHint" placeholder="What should the party achieve? Give the context they need."></textarea>
      </label>
      <label id="new-quest-app-label"><span data-w="app">Application</span>
        <select name="app" id="new-quest-app"></select>
      </label>
      <label><span id="new-quest-cwd-label">Directory</span>
        <input name="cwd" placeholder="/home/you/project" spellcheck="false">
      </label>
      <div class="row">
        <fieldset class="seg"><legend>Mode</legend>
          <label><input type="radio" name="mode" value="read" checked> Read-only</label>
          <label><input type="radio" name="mode" value="edit"> Edit (git branches)</label>
        </fieldset>
        <fieldset class="seg"><legend>Planning</legend>
          <label><input type="radio" name="planning" value="review" checked> I review</label>
          <label><input type="radio" name="planning" value="auto"> Automatic</label>
        </fieldset>
        <label class="narrow"><span data-w="partySize">Party size</span>
          <input name="maxAgents" type="number" min="1" max="20" value="6">
        </label>
      </div>
      <p class="error" id="new-quest-error"></p>
      <div class="actions">
        <button type="button" data-close class="btn ghost">Cancel</button>
        <button id="new-quest-submit" value="ok" class="btn gold" data-w="summon">Summon the Archmage</button>
      </div>
    </form>
  </dialog>

  <!-- Application (create / edit) -->
  <dialog id="app-dialog" class="panel">
    <form method="dialog" id="app-form">
      <h2 id="app-dialog-title"></h2>
      <label>Name <input name="name" required placeholder="TTRPG platform"></label>
      <label>Description <input name="description" placeholder="What the system is, in one line"></label>
      <label>Directories
        <textarea name="repos" rows="3" required class="mono" spellcheck="false" placeholder="/home/you/backend&#10;/home/you/client"></textarea>
        <span class="small">One per line. Each is named after its folder; write <code>name=/path</code> to choose the name.</span>
      </label>
      <label>Standing context
        <textarea name="context" rows="6" placeholder="Told to the Archmage at the start of every quest: how the parts fit together, contracts between them, conventions, things never to break."></textarea>
      </label>
      <div class="row">
        <label>Default mode <select name="mode"><option value="">Ask each time</option><option value="read">Read-only</option><option value="edit">Edit (git branches)</option></select></label>
        <label>Default planning <select name="planning"><option value="">Ask each time</option><option value="review">I review</option><option value="auto">Automatic</option></select></label>
        <label class="narrow"><span data-w="partySize">Party size</span> <input name="maxAgents" type="number" min="1" max="20" placeholder="global"></label>
      </div>
      <p class="error" id="app-error"></p>
      <div class="actions">
        <button type="button" data-close class="btn ghost">Cancel</button>
        <button value="ok" class="btn gold">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Settings -->
  <dialog id="settings" class="panel wide">
    <form method="dialog" id="settings-form">
      <h2>Settings</h2>
      <div class="row">
        <label>Theme <select name="theme" id="theme-select"></select></label>
        <label>Portrait style <select name="style" id="style-select"></select></label>
        <label class="narrow">Max running agents <input name="maxConcurrent" type="number" min="1" max="32"></label>
        <label class="narrow"><span data-w="defaultPartySize">Default party size</span> <input name="maxAgents" type="number" min="1" max="20"></label>
        <label class="narrow">Report batch (s) <input name="batchSeconds" type="number" min="5" max="600"></label>
      </div>
      <h3>Role catalog</h3>
      <div id="role-gallery" class="role-gallery"></div>
      <details>
        <summary>Edit the catalog (JSON)</summary>
        <textarea id="roles-json" rows="18" spellcheck="false" class="mono"></textarea>
        <button type="button" id="roles-save" class="btn">Save catalog</button>
        <span class="error" id="roles-error"></span>
      </details>
      <div class="actions">
        <button type="button" data-close class="btn ghost">Close</button>
        <button value="ok" class="btn gold">Save settings</button>
      </div>
    </form>
  </dialog>

  <!-- Agent detail -->
  <dialog id="agent-detail" class="panel wide">
    <div id="agent-detail-body"></div>
    <form method="dialog" class="actions"><button class="btn ghost">Close</button></form>
  </dialog>

  <!-- Attached file viewer -->
  <dialog id="file-viewer" class="panel wide">
    <h2 id="file-title"></h2>
    <p id="file-meta" class="muted small"></p>
    <div id="file-body" class="file-body"></div>
    <form method="dialog" class="actions"><button class="btn ghost">Close</button></form>
  </dialog>

  <!-- Text prompt (message / answer) -->
  <dialog id="prompt" class="panel">
    <form method="dialog" id="prompt-form">
      <h2 id="prompt-title"></h2>
      <p id="prompt-hint" class="muted"></p>
      <textarea name="text" rows="5" required></textarea>
      <div class="actions">
        <button type="button" data-close class="btn ghost">Cancel</button>
        <button value="ok" class="btn gold">Send</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/web/app.js"></script>
</body>
</html>
